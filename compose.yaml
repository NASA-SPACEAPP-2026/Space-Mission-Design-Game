services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: gng
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: gng
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gng"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres-data:
