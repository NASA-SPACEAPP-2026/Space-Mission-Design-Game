/* finestre */

.stamp{align-self:flex-start;font:700 44px/1 var(--f-d);letter-spacing:.1em;color:var(--ok);border:4px double var(--ok);border-radius:8px;padding:6px 18px 4px;transform:rotate(-5deg);animation:stamp .38s cubic-bezier(.2,1.3,.4,1) both}

@keyframes stamp{from{transform:rotate(-5deg) scale(2.3);opacity:0}to{transform:rotate(-5deg) scale(1);opacity:1}}
.pop{position:fixed;z-index:45;left:16px;top:calc(72px + env(safe-area-inset-top,0px));width:min(380px,calc(100vw - 32px));background:#fff;border:1.5px solid var(--line);border-radius:14px;box-shadow:0 10px 30px rgba(30,42,58,.25);padding:10px;display:grid;gap:6px;max-height:70vh;overflow:auto}

@media (max-width:640px){ .campus3{height:62vh} .chint{max-width:calc(100% - 24px);top:58px} .ctile{flex-basis:84px} .ctile svg{width:76px;height:50px} }

@media (max-width:640px){ .fled{grid-template-columns:1fr} .fled canvas{width:100%;height:auto;aspect-ratio:5/3} }
.room3{position:relative;background:#E9EDE6;border-radius:20px;overflow:hidden;box-shadow:0 4px 18px rgba(40,50,30,.10)}

@media (max-width:640px){ .trophy small{display:none} .trophy{padding:5px 7px 5px 5px;font-size:13px} .trophy svg{width:22px;height:22px} .room3 .chint{max-width:calc(100% - 24px);top:auto;bottom:10px} }
