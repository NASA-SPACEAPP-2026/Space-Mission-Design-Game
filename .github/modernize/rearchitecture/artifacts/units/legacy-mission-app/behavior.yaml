unit: legacy-mission-app
side_effects:
  - source_loc: "Go-No-Go.html:3354"
    effect: "Serializes the entire mutable game object G to localStorage['gng32.save']; before saving, payPhase can mutate mission finances and schedule a toast."
    must_preserve: true
  - source_loc: "Go-No-Go.html:5731"
    effect: "Rendering updates mission-level derived state, HUD/view, tutorial coach, and persists the current save."
    must_preserve: true
  - source_loc: "Go-No-Go.html:6667"
    effect: "Persists the Italian/English language preference under gngLang, then reloads the document."
    must_preserve: true
  - source_loc: "Go-No-Go.html:6274"
    effect: "Builds a mission report from current mission/design/result data; report actions can generate/download a file."
    must_preserve: true
branches:
  - source_loc: "Go-No-Go.html:3355"
    condition: "Stored JSON parses and its root version equals 32."
    behavior: "Restores the saved state; otherwise load returns null and initialization creates a fresh game state."
    must_preserve: true
  - source_loc: "Go-No-Go.html:7036"
    condition: "URL query parameter new=1 is present."
    behavior: "Bypasses existing save loading and starts fresh; without it, tries the legacy save."
    must_preserve: true
  - source_loc: "Go-No-Go.html:7026"
    condition: "No usable saved state exists."
    behavior: "Initializes agency/campus/progression state and offers the welcome/tutorial, direct play, or sandbox path."
    must_preserve: true
  - source_loc: "Go-No-Go.html:5731"
    condition: "Current view/mission phase changes."
    behavior: "Renders one of launch, hub, admin, build, test, mcc, pad, fac, or fd; mission phases include 0, A-F, and done."
    must_preserve: true
  - source_loc: "Go-No-Go.html:6956"
    condition: "Player starts the guided tutorial."
    behavior: "Creates a tutorial mission and guides the user through the mission path; tutorial progression has skip/complete behavior."
    must_preserve: true
  - source_loc: "Go-No-Go.html:6665"
    condition: "Player confirms the reset action."
    behavior: "Removes the legacy save, resets game state, and returns to the hub."
    must_preserve: true
error_paths:
  - source_loc: "Go-No-Go.html:3355"
    trigger: "Saved JSON is malformed, absent, or has a version other than 32."
    outcome: "load() returns null; startup initializes a fresh game. The outer startup error panel provides an explicit reset action for a thrown startup failure."
    contract: "No network contract; storage errors are swallowed by the loader."
    must_preserve: true
  - source_loc: "Go-No-Go.html:3354"
    trigger: "Browser storage write fails or quota is exceeded."
    outcome: "The save exception is swallowed; no explicit user-visible save-failure status is guaranteed."
    contract: "No explicit error contract."
    must_preserve: true
concurrency:
  model: event-loop
  tx_boundary: null
# ## Upstream Artifacts Consumed
