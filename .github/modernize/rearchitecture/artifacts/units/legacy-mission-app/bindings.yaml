unit: legacy-mission-app
bindings:
  - type: route-declaration
    name: "Legacy standalone game document"
    source_loc: "app/frontend/vite.config.ts:11"
    target: "/legacy-game.html"
    must_appear_in_target: false
    notes: "Vite serves the root HTML in development and copies it into production output; the target must not retain this as its gameplay runtime."
  - type: listener
    name: "Legacy Three.js renderer"
    source_loc: "Go-No-Go.html:793"
    target: "Three.js r128 loaded from cdnjs"
    must_appear_in_target: false
    notes: "The legacy page also uses its own inline SVG and domain rendering code."
  - type: convention
    name: "Global browser API"
    source_loc: "Go-No-Go.html:7039"
    target: "window.GNG"
    must_appear_in_target: false
    notes: "Exposes translation, DRM, placement, state, actions, tick, render, navigation, and flight-dynamics refresh; no other repository caller was found."
runtime_config:
  - key: "Legacy new-game query"
    source_loc: "Go-No-Go.html:7036"
    source: code
    default_value: "new=1 forces fresh state; otherwise load gng32.save"
    must_appear_in_target: false
    notes: "Used by shell for New Game. The future routed game must implement fresh-vs-resume explicitly."
  - key: "Legacy language key"
    source_loc: "Go-No-Go.html:3366"
    source: code
    default_value: "browser locale, default Italian; persisted it/en override"
    must_appear_in_target: true
    notes: "Legacy language choice is browser-local."
  - key: "Three.js CDN"
    source_loc: "Go-No-Go.html:797"
    source: code
    default_value: "https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"
    must_appear_in_target: false
    notes: "External network dependency of the old game."
  - key: "Draco decoder CDN"
    source_loc: "app/frontend/src/main.ts:101"
    source: code
    default_value: "https://www.gstatic.com/draco/versioned/decoders/1.5.7/"
    must_appear_in_target: true
    notes: "PlayCanvas model decoding currently relies on external decoder URLs."
