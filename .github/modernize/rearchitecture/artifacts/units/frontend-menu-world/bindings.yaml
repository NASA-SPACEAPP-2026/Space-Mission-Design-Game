unit: frontend-menu-world
bindings:
  - type: route-declaration
    name: "Vite SPA entry at /"
    source_loc: "app/frontend/index.html:1"
    target: "index.html -> /src/main.ts"
    must_appear_in_target: true
    notes: "No client-side router is currently configured; all menu/world states are a single document."
  - type: route-declaration
    name: "Legacy mission iframe"
    source_loc: "app/frontend/index.html:88"
    target: "#legacyGame iframe"
    must_appear_in_target: false
    notes: "The approved final gameplay must not depend on this iframe."
  - type: listener
    name: "PlayCanvas scene, keyboard, mouse, and pointer-lock input"
    source_loc: "app/frontend/src/main.ts:98"
    target: "pc.Application and window/document/canvas listeners"
    must_appear_in_target: true
    notes: "TouchDevice is constructed, but movement/look listeners inspected are keyboard and pointer-lock/mouse; no touch movement behavior is wired."
runtime_config:
  - key: "Vite dev server port"
    source_loc: "app/frontend/vite.config.ts:32"
    source: code
    default_value: "5173"
    must_appear_in_target: true
    notes: "Current local browser entry."
  - key: "API proxy target"
    source_loc: "app/frontend/vite.config.ts:34"
    source: code
    default_value: "http://localhost:8080"
    must_appear_in_target: true
    notes: "Vite proxies /api to the local backend."
  - key: "localStorage key space-mission-settings"
    source_loc: "app/frontend/src/main.ts:10"
    source: code
    default_value: "{sensitivity:0.15,walkSpeed:6}"
    must_appear_in_target: true
    notes: "Shell-level input preferences; values are clamped when loaded."
  - key: "localStorage key gng32.save"
    source_loc: "app/frontend/src/main.ts:9"
    source: code
    default_value: null
    must_appear_in_target: false
    notes: "The shell reads presence only; content is owned by the legacy game and must be offered for migration only with consent."
