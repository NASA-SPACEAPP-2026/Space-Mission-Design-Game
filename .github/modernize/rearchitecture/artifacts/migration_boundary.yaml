user_intent:
  raw_request: "Rebuild all Go-No-Go activities as a complete first-person 3D web game, remove iframe gameplay from the final runtime, and add online MySQL-backed save/load with consent-only legacy import."
  inferred_acceptance:
    - "The target PlayCanvas application owns gameplay; no legacy iframe is required at runtime."
    - "Existing mission behavior is studied and represented in the new application; incomplete flows are explicitly reported."
    - "Mission persistence is account-backed; importing a v32 localStorage save requires explicit consent."
    - "The legacy source and existing user save data are not silently deleted."
  cleanup_required: false
strategy: minimal_runtime
runtime_reachable:
  - app/frontend/index.html
  - app/frontend/src/main.ts
  - app/frontend/src/style.css
  - app/frontend/vite.config.ts
  - app/frontend/public/assets/nasa/Astronaut.glb
  - app/frontend/public/assets/nasa/Crab-Nebula.glb
  - app/backend/src/index.ts
must_rewrite:
  - path: app/frontend/index.html
    reason: "Current single menu/world/iframe page must become the approved routed 3D application shell."
  - path: app/frontend/src/main.ts
    reason: "Current PlayCanvas bootstrap, input loop, localStorage gate, and iframe orchestration are the active client runtime."
  - path: app/frontend/src/style.css
    reason: "Current shell styles do not implement the approved design system and accessible route/UI states."
  - path: app/frontend/vite.config.ts
    reason: "Current Vite plugin serves and emits the legacy iframe page; it must no longer wire that page into the final runtime."
  - path: app/backend/src/index.ts
    reason: "Current backend only implements the liveness endpoint and must grow the approved authenticated save/load and readiness behavior."
  - path: package.json
    reason: "Root scripts currently lack the requested npm run dev and test commands."
  - path: app/frontend/package.json
    reason: "The active client package needs the approved target version range and UI/routing/test dependencies as selected during design."
  - path: app/backend/package.json
    reason: "The API package currently lacks MySQL, authentication/session, validation, migration, and test dependencies."
  - path: package-lock.json
    reason: "Lockfile must correspond to the final workspace dependency graph and reproducible scripts."
copy_as_is:
  - app/frontend/public/assets/nasa/Astronaut.glb
  - app/frontend/public/assets/nasa/Crab-Nebula.glb
  - documentation/nasa-assets.md
legacy_allowed_to_remain:
  - Go-No-Go.html
defer_cleanup:
  - "Keep Go-No-Go.html as a read-only behavior and version-32 data reference until parity/import validation is accepted; do not serve it as the final gameplay implementation."
  - "Existing documentation describing iframe gameplay becomes stale and should be updated as part of implementation documentation."
full_rewrite_reason: null
implementation_rule: >
  Implementation scope follows must_rewrite. source_anchors prove current behavior exists and are not
  a general instruction to modify the legacy HTML. Keep the legacy source and localStorage data
  non-destructive; remove only its active iframe serving/loading path from the target runtime.
notes:
  - "The target runtime cut is intentionally limited to the browser app, API, and workspace manifests; Go-No-Go.html remains an inspectable source anchor."
  - "The import schema, entity mapping, and exact API route are not established by this analysis; the design and DBA artifacts must define them from the observed v32 state."
# ## Upstream Artifacts Consumed
# - .github/modernize/rearchitecture/clarification.md — rewrite and non-destructive import acceptance.
# - .github/modernize/rearchitecture/artifacts/project-profile.yaml — current module layout.
#
# ## Evidence Mapping
# - clarification.md#Generic -> rewrite only the target runtime boundary while retaining the legacy source.
# - clarification.md#Backend -> backend runtime participates in the acceptance scope.
