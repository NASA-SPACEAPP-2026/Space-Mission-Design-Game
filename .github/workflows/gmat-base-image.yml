name: GMAT base image

# Publishes the heavy GMAT layer (NASA GMAT R2025a + Node) to GitHub Container Registry, once,
# so `npm run dev` pulls it instead of every developer downloading ~420 MB from SourceForge.
on:
  workflow_dispatch:
  push:
    branches: [main, dev]
    paths:
      - docker/gmat/Dockerfile.base
      - .github/workflows/gmat-base-image.yml

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build and push smdg-gmat-base
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v5

      - name: Image name (registry names must be lowercase)
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/smdg-gmat-base" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # NASA only ships GMAT for linux/amd64, so that is the only platform.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/gmat/Dockerfile.base
          platforms: linux/amd64
          push: true
          tags: ${{ steps.img.outputs.name }}:r2025a
