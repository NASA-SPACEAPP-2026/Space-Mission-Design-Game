name: CI/CD

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run check
      - run: npm run package:azure

      # Only pushes (dev, main) get deployed, so only they need the package.
      - name: Upload package
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v6
        with:
          name: app-package
          path: release.zip
          retention-days: 7

  deploy:
    name: Deploy (${{ github.ref_name == 'main' && 'production' || 'staging' }})
    needs: build-test
    if: github.event_name == 'push'
    runs-on: ubuntu-26.04
    # main -> production, dev -> staging. Each GitHub Environment holds its own
    # AZURE_WEBAPP_NAME variable (and can require manual approval).
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
      url: https://${{ vars.AZURE_WEBAPP_NAME }}.azurewebsites.net
    permissions:
      id-token: write # OIDC login to Azure, no stored password
      contents: read
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: app-package

      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          resource-group-name: ${{ vars.AZURE_RESOURCE_GROUP || 'rg-space-mission-game' }}
          package: release.zip
          # The old deployment used app/backend/dist/index.js. Clean it and
          # point App Service at the static server on every deploy.
          clean: true
          restart: true
          startup-command: node server.mjs

      # The deploy action can leave the previous Node process serving the old
      # files. Restart explicitly so the smoke test sees the new server code.
      - name: Restart App Service
        run: |
          az webapp restart \
            --name "${{ vars.AZURE_WEBAPP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP || 'rg-space-mission-game' }}"

      - name: Smoke test
        run: |
          url="https://${{ vars.AZURE_WEBAPP_NAME }}.azurewebsites.net"
          # Free-tier apps cold start slowly, so retry for up to ~3 minutes.
          for attempt in $(seq 1 18); do
            if curl -fsS --max-time 20 "$url/api/health" | grep -q '"status":"ok"'; then
              echo "Static server healthy at $url"
              headers="$(curl -sSI --max-time 20 -H 'Accept-Encoding: br' "$url/")"
              if ! grep -qi 'content-encoding: br' <<<"$headers" || ! grep -qi 'etag:' <<<"$headers"; then
                echo "Compressed server not active yet, retrying..."
                sleep 10
                continue
              fi
              echo "Compression and HTTP validators active"
              frontend="$(curl -fsS --max-time 20 "$url/")"
              grep -q "Go No-Go" <<<"$frontend"
              echo "Frontend reachable"
              # Fail if the old Express shell is still being served.
              grep -q '/assets/game-' <<<"$frontend"
              bundle="$(grep -o '/assets/game-[a-f0-9]*\.js' <<<"$frontend" | head -1)"
              [ -n "$bundle" ]
              curl -fsS --max-time 20 -o /dev/null "$url$bundle"
              echo "2D bundle reachable"
              curl -fsS --max-time 20 -o /dev/null "$url/fonts/ibm-plex-sans.woff2"
              echo "Font asset reachable"
              curl -fsS --max-time 20 -o /dev/null "$url/audio/theme.mp3"
              echo "Audio asset reachable"
              exit 0
            fi
            echo "Attempt $attempt failed, retrying in 10s..."
            sleep 10
          done
          echo "Smoke test failed for $url" >&2
          exit 1
